name: Build Run

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'サイトを選択してください'
        required: true
        type: choice
        options:
          - AIRDO
          - RECRUIT_AGENT
          - PINT

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AIRDO_LOGIN_ID: ${{ secrets.AIRDO_LOGIN_ID }}
      AIRDO_PASSWORD: ${{ secrets.AIRDO_PASSWORD }}
      RECRUIT_AGENT_LOGIN_ID: ${{ secrets.RECRUIT_AGENT_LOGIN_ID }}
      RECRUIT_AGENT_PASSWORD: ${{ secrets.RECRUIT_AGENT_PASSWORD }}
      PINT_LOGIN_ID: ${{ secrets.PINT_LOGIN_ID }}
      PINT_PASSWORD: ${{ secrets.PINT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start Database and App with Docker Compose
        run: |
          docker-compose up --build --abort-on-container-exit
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: scraper_db
          DB_USER: scraper
          DB_PASSWORD: password

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 \
            libnss3 \
            libasound2t64

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Run jar
        run: |
          java -jar build/libs/*.jar \
            "${{ github.event.inputs.site }}"
      
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: after-login.png
