version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${DB_NAME:-scraper_db}
      POSTGRES_USER: ${DB_USER:-scraper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scraper-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-scraper_db}
      DB_USER: ${DB_USER:-scraper}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scraper-network
    volumes:
      - ./output:/app/output

volumes:
  postgres_data:

networks:
  scraper-network:
    driver: bridge
