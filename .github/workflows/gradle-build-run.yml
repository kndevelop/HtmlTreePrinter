name: Build Run

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'サイトを選択してください'
        required: true
        type: choice
        options:
          - AIRDO
          - RECRUIT_AGENT
          - PINT

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: scraper_db
          POSTGRES_USER: scraper
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      AIRDO_LOGIN_ID: ${{ secrets.AIRDO_LOGIN_ID }}
      AIRDO_PASSWORD: ${{ secrets.AIRDO_PASSWORD }}
      RECRUIT_AGENT_LOGIN_ID: ${{ secrets.RECRUIT_AGENT_LOGIN_ID }}
      RECRUIT_AGENT_PASSWORD: ${{ secrets.RECRUIT_AGENT_PASSWORD }}
      PINT_LOGIN_ID: ${{ secrets.PINT_LOGIN_ID }}
      PINT_PASSWORD: ${{ secrets.PINT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U scraper; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
          PGPASSWORD: password

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 \
            libnss3 \
            libasound2t64

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Run jar
        run: |
          java -jar build/libs/*.jar \
            "${{ github.event.inputs.site }}"
      
      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: after-login.png
