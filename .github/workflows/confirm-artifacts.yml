name: List Artifacts
on:
  workflow_dispatch:
jobs:
  list-artifacts:
    runs-on: ubuntu-latest
    steps:
     - name: Check GitHub CLI
       run: |
        which gh
        gh --version
        
     - name: List artifacts
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         gh api repos/${{ github.repository }}/actions/artifacts \
           --jq '.artifacts[] | [.id, .name, .size_in_bytes] | @tsv'
