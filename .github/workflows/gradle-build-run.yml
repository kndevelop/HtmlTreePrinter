name: Build Run

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'サイトを選択してください'
        required: true
        type: choice
        options:
          - AIRDO
          - RECRUIT_AGENT
          - PINT

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AIRDO_LOGIN_ID: ${{ secrets.AIRDO_LOGIN_ID }}
      AIRDO_PASSWORD: ${{ secrets.AIRDO_PASSWORD }}
      RECRUIT_AGENT_LOGIN_ID: ${{ secrets.RECRUIT_AGENT_LOGIN_ID }}
      RECRUIT_AGENT_PASSWORD: ${{ secrets.RECRUIT_AGENT_PASSWORD }}
      PINT_LOGIN_ID: ${{ secrets.PINT_LOGIN_ID }}
      PINT_PASSWORD: ${{ secrets.PINT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Start Database and App with Docker Compose
        run: |
          docker-compose up -d
        env:
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: scraper_db
          DB_USER: scraper
          DB_PASSWORD: password
          SITE: ${{ github.event.inputs.site }}

      - name: Wait for database to be ready
        run: |
          for i in {1..12}; do
            if pg_isready -h localhost -p 5432 -U scraper > /dev/null 2>&1; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database... ($i/12)"
            sleep 5
            if [ $i -eq 12 ]; then
              echo "Database failed to start"
              docker-compose logs postgres
              exit 1
            fi
          done

      - name: Create and populate test database
        run: |
          PGPASSWORD=password psql -h localhost -p 5432 -U scraper -d scraper_db -c "
          CREATE TABLE IF NOT EXISTS users (
            user_id SERIAL PRIMARY KEY,
            user_name VARCHAR(255) NOT NULL,
            password VARCHAR(255) NOT NULL
          );
          
          INSERT INTO users (user_name, password) VALUES
          ('testuser1', 'password123'),
          ('testuser2', 'password456'),
          ('testuser3', 'password789');
          "

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 \
            libnss3 \
            libasound2t64

      - name: Create screenshots directory
        run: mkdir -p screenshots

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Clean up database - Drop users table
        if: always()
        run: |
          PGPASSWORD=password psql -h localhost -p 5432 -U scraper -d scraper_db -c "DROP TABLE IF EXISTS users;"

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: after-login.png