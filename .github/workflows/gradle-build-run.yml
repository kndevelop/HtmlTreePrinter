name: Build Run

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'サイトを選択してください'
        required: true
        type: choice
        options:
          - AIRDO
          - RECRUIT_AGENT

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnspr4 \
            libnss3 \
            libasound2t64

      - name: Set config
        env:
          AIRDO_SETTING: ${{ secrets.AIRDO_SETTING }}
          RECRUIT_AGENT_SETTING: ${{ secrets.RECRUIT_AGENT_SETTING }}
        run: |
          case "${{ inputs.url }}" in
            AIRDO)
              echo "CONFIG_JSON=$AIRDO_SETTING"
              ;;
            RECRUIT_AGENT)
              echo "CONFIG_JSON=$RECRUIT_AGENT_SETTING"
              ;;
          esac

          {
            echo "CONFIG_JSON<<EOF"
            echo "$CONFIG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run jar
        run: |
          java -jar build/libs/*.jar